[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depcompass"
version = "0.1.0.dev0"
description = "Grounded, version-pinned dependency reference docs for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cormac O' Sullivan" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer",
    "rich",
    "anthropic",
]
# Note: no `tomli` dependency — requires-python >=3.11 means `tomllib` is
# available in the standard library (see decisions/0009).

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
depcompass = "depcompass.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: exercises a real external tool (npm/cargo) — network/toolchain dependent, skipped automatically when the tool isn't present",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
