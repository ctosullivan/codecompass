schema_version: 1
document: README.md
audience: "a developer new to CodeCompass, has not read any other doc"
sections:
  - id: vendor-digest-concept
    required_knowledge: ["CL-CTXT-005"]
    max_evidence_chars: 4000
    tone: instructional
    depth: brief
    min_claim_status: supported
    allow_unconfirmed_scopes: true  # CL-CTXT-005 is a self-knowledge Claim from the
                                     # Phase 79/80 snapshot, not an oracle-contract-backed
                                     # implementation fact -- codecompass-domain has no
                                     # oracle-contract.yaml, so knowledge_api's currency
                                     # check honestly reports "unconfirmed" (no contract
                                     # applies) rather than "stale" or "wrong". Allowed here
                                     # deliberately, not a silent gap-suppression.
    citation_display: none
acceptance_criteria:
  - "An unfamiliar developer understands what a 'vendor digest' is and where it's produced."
owner: lead
