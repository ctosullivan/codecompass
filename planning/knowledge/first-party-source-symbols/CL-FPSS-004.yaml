id: CL-FPSS-004
kind: claim
statement: >
  The occurrence-based symbol identity rule -- UNIQUE(source_file_id,
  name, kind, line) at the schema level, line: int (never None) in
  SourceSymbol -- exists to solve a real, reproducible problem: ordinary
  function overloading (a real, common language feature in both Python
  via @typing.overload and TypeScript via repeated signature
  declarations) produces multiple declarations that legitimately share
  one (source_file_id, name, kind) triple but occupy distinct lines. A
  name-only (or name+kind-only) identity key would make the second such
  declaration collide with the first as a uniqueness violation the
  moment any real project containing an overload was synced. The problem
  this solves is not merely a name clash in the abstract -- it is
  specifically that overloads are multiple *individually real*
  declarations, not duplicate facts about one logical symbol, so an
  identity scheme that could only keep one of them (whether by rejecting
  the insert or by silently merging/overwriting) would discard real,
  legitimate information a caller inspecting a specific line deserves an
  accurate answer about.
derivation: DE-FPSS-004
assertion_kind: invariant
basis: observed_behaviour
supporting_evidence: ["EV-FPSS-010", "EV-FPSS-011", "EV-FPSS-012"]
contradicting_evidence: ["EV-FPSS-013"]
examples: ["a real @typing.overload-stacked Python `foo` (two @overload stubs + one implementation) produces 3 rows named foo, each at a distinct line, none dropped (real execution)", "a real overloaded TypeScript `foo` (two signature-only declarations + one implementation) produces 3 rows named foo, each at a distinct line, none dropped (real execution)"]
counterexamples: []
depends_on: []
open_questions: ["graph_schema_fragment.py's own Block 2 shows the SourceSymbolRow dataclass with only 3 fields (source_file_path, name, kind), omitting line/purpose/exposure -- inconsistent with its own docstring (which names line as part of the key) and with Block 5's own function body (which reads s.line/s.purpose/s.exposure as real attributes). This is treated as a curation gap in this specific export, not as evidence that the real graph.py's SourceSymbolRow actually lacks these fields -- the source-level extraction logic and the schema's own UNIQUE/NOT NULL constraints (both independently confirmed) make the 4-field key the only self-consistent reading, but this discrepancy could not be resolved from the files given and is named here rather than silently smoothed over."]
