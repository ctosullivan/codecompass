examples: ["a Python class with a method `def bar(self): ...` produces zero SourceSymbol rows for `bar` -- only top-level module members are ever visited (real source read)", "a TS file containing `export const useWidget = () => {}` produces a row with kind=\"const\", not kind=\"function\" (real source read)"]
