id: CL-FPSS-006
kind: claim
statement: >
  _migrate_source_files_columns implements a nullable-everywhere
  migration contract, not a "NOT NULL once populated" contract: it adds
  each of source_files's four new Phase-77 columns (language,
  content_hash, symbol_index_status, symbol_index_diagnostic) via a
  separate `ALTER TABLE ... ADD COLUMN` statement, each with no NOT NULL
  constraint and no DEFAULT clause, gated by a PRAGMA table_info
  introspection check so only genuinely-missing columns are added (an
  idempotent, rerun-safe design). It never drops or recreates
  source_files, specifically because source_files.id is referenced by
  uses_edges.source_file_id ON DELETE CASCADE, and a drop/recreate would
  cascade-delete every uses_edges row -- this same column set is also
  declared identically (all four nullable, no NOT NULL) in the CREATE
  TABLE source_files statement used for a brand-new database, so a
  fresh and a migrated database are meant to end up with identical
  column definitions. The additional claim that this equivalence is
  "verified directly (test_graph.py)" is the ADR's own self-report; the
  original dispatch's export did not include tests/test_graph.py, so
  that specific test's existence and outcome could not be independently
  confirmed at that time. A subsequent adversarial review with full
  repository access located
  tests/test_graph.py::test_fresh_and_upgraded_source_files_schema_are_identical,
  read it, and ran it plus its sibling migration-safety test against the
  real, unmodified code -- both PASS. The ADR's self-citation is
  accurate, not merely asserted.
