id: CL-FPSS-005
kind: claim
statement: >
  meta.source_index_version is documented (by decisions/0065 and the
  phase-77 plan) as a project-level marker whose *absence* (not a NULL
  value -- its total absence as a key) is meant to mean "first-party
  source has never been indexed under Phase-77-aware code," distinct
  from a per-file symbol_index_status value, and is meant to be written
  unconditionally by rebuild_deterministic on every Phase-77-aware
  rebuild (even one finding zero first-party files) so that a genuine
  "not yet indexed" project state is never confused with a genuine
  "indexed, but this symbol doesn't exist" negative result. This
  statement describes documented design *intent*, as both source
  documents themselves frame it (the ADR's own "Decision" section, the
  plan's own "new, this amendment" section) -- no code implementing
  either the write path (rebuild_deterministic) or the read/gate path
  (the pre-check that decisions/0065 point 7 says query source / query
  source-symbol perform) is present anywhere in this export, so this
  claim cannot be treated as independently confirmed current behaviour
  the way CL-FPSS-002/003/004 are.
