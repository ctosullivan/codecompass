id: CL-FPSS-005
kind: claim
statement: >
  meta.source_index_version is documented (by decisions/0065 and the
  phase-77 plan) as a project-level marker whose *absence* (not a NULL
  value -- its total absence as a key) is meant to mean "first-party
  source has never been indexed under Phase-77-aware code," distinct
  from a per-file symbol_index_status value, and is meant to be written
  unconditionally by rebuild_deterministic on every Phase-77-aware
  rebuild (even one finding zero first-party files) so that a genuine
  "not yet indexed" project state is never confused with a genuine
  "indexed, but this symbol doesn't exist" negative result. This
  statement originally described documented design *intent* only, as
  both source documents themselves frame it (the ADR's own "Decision"
  section, the plan's own "new, this amendment" section) -- the
  producing dispatch's own export contained no code implementing either
  the write path (rebuild_deterministic) or the read/gate path (cli.py).
  A subsequent adversarial review with full repository access confirmed
  both directly: sync.py:417-438 unconditionally passes
  source_index_version="1" into rebuild_deterministic, graph.py:1071-1076
  writes it whenever non-None, and cli.py:1094/1157 gate on the key's
  absence before reading source_files/source_symbols -- matching the
  documented intent exactly, including the "written even with zero
  first-party files" detail.
