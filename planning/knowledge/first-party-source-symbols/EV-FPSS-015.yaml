what_it_shows: >
  decisions/0065 point 3 and planning/phase-77 sections 3.1/4 state that
  source_files.language/content_hash/symbol_index_status/
  symbol_index_diagnostic are nullable identically on a fresh or
  upgraded database, with no NOT NULL-eventually contract, rejecting an
  earlier design that would have diverged the two cases. This is
  directly consistent with graph_schema_fragment.py's own schema code:
  Block 1's CREATE TABLE source_files statement declares all four
  columns with no NOT NULL constraint (only path is NOT NULL UNIQUE);
  Block 3's _migrate_source_files_columns adds each of the same four
  columns to a pre-existing table via ALTER TABLE ... ADD COLUMN with no
  NOT NULL and no DEFAULT clause, gated by a PRAGMA table_info
  introspection check that adds only genuinely-missing columns, and
  never drops or recreates the table. The ADR's own text additionally
  claims this fresh/upgraded equivalence was "verified directly
  (test_graph.py): PRAGMA table_info(source_files) returns identical
  column definitions" -- tests/test_graph.py is not included in this
  export, so this specific test's existence/content/pass status could
  not be independently confirmed here.
