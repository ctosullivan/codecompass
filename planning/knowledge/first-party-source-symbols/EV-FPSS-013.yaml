kind: evidence
evidence_kind: source
what_it_shows: >
  graph_schema_fragment.py's Block 2 SourceSymbolRow dataclass, as shown
  in this export, lists only three fields (source_file_path: str, name:
  str, kind: str), despite its own docstring stating the row is "keyed
  by (source_file_path, name, kind, line)" and stating "line is never
  None". Block 5's _sync_source_symbols function body (in the same
  export) references s.line, s.purpose, and s.exposure as real
  attributes of each SourceSymbolRow instance it iterates over -- fields
  absent from Block 2's own shown dataclass body. This is an internal
  inconsistency within the export as given, not resolved by any file in
  this export; it is treated here as a genuine gap rather than resolved
  by inference about what the real graph.py "must" contain, since doing
  so would require assuming content outside the assigned directory.
