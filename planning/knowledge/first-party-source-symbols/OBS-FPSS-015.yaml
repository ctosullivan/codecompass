  The real SourceSymbolRow is a frozen dataclass with six fields:
  source_file_path: str, name: str, kind: str, line: int, purpose:
  str | None = None, exposure: str | None = None -- matching its own
  docstring ("keyed by (source_file_path, name, kind, line)... line is
  never None") exactly, and matching what _sync_source_symbols's real
  body actually reads (s.line, s.purpose, s.exposure as real attributes
  on each instance). The CREATE TABLE source_symbols statement declares
  line INTEGER NOT NULL and UNIQUE(source_file_id, name, kind, line),
  confirming the 4-field occurrence-based key exactly as CL-FPSS-004
  states. graph_schema_fragment.py's Block 2 (3-field dataclass body)
  does not match the real file -- it is a curation/transcription gap
  in the export given to the original dispatch, not evidence of any
  real inconsistency in graph.py itself.
