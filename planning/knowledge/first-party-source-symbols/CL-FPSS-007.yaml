id: CL-FPSS-007
kind: claim
statement: >
  The indexed_partial techniques' "honest, coarse" fidelity limitation
  that decisions/0065/planning/phase-77 describe only in general prose
  ("a multi-line signature, an unusual formatting style, or (rarely) a
  false match inside a string/comment can defeat them") is real and
  trivially reproducible with ordinary Rust/TypeScript constructs, but
  its concrete shape is narrower and more specific than a first reading
  of that prose suggests. Specifically: (a) a parameter list spanning
  multiple physical lines does NOT, by itself, defeat either extractor,
  because both regexes only need to match the keyword+name text on the
  line where a declaration's own name first appears; (b) a single-line
  "//" comment or a single-line string literal containing
  declaration-like text does NOT produce a false match, because both
  item regexes anchor with `^` against each line's own stripped leading
  content; but (c) a multi-line Rust raw-string literal whose own
  interior line matches the anchored pattern DOES produce a genuine
  false-positive source_symbols row, and (d) a plain "/* ... */" block
  comment in JS/TS (as opposed to a "/**" JSDoc comment, which is
  specially recognized) is not treated as a comment at all, so a
  commented-out declaration inside one DOES produce a genuine
  false-positive row. Both real false positives are silent: status stays
  indexed_partial, diagnostic stays None, with nothing in the returned
  SourceFileExtraction distinguishing them from genuine declarations.
derivation: DE-FPSS-007
