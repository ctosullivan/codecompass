basis: observed_behaviour
supporting_evidence: ["EV-FPSS-008", "EV-FPSS-009", "EV-FPSS-021", "EV-FPSS-022"]
contradicting_evidence: []
examples: ["a Rust file containing `let s = r#\"\\npub fn embedded_in_string() {}\\n\"#;` produces a real, silent false-positive `embedded_in_string` row (real probe)", "a TS file containing `/*\\nexport function commented_out(): void {}\\n*/` produces a real, silent false-positive `commented_out` row (real probe)"]
counterexamples: ["a genuinely multi-line function signature is handled correctly (real probe)", "a single-line comment or string containing declaration-like text is handled correctly (real probe)"]
depends_on: ["CL-FPSS-003"]
open_questions: ["whether these two specific false-positive shapes (multi-line raw strings, plain block comments) are the ones decisions/0065's own prose intended to describe, or merely two of possibly several unenumerated ones, could not be determined from the documents alone -- this claim adds evidence the ADR/plan do not themselves contain, rather than merely restating them"]
