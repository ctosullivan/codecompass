raw_result: >
  ADR 0065, status Accepted (2026-09-29). Nine numbered decision points:
  (1) source_symbols as a new table, not nullable symbols.vendor_id;
  (2) a new Language concept (python/rust/javascript/typescript/haskell)
  distinct from core.Ecosystem (whose single NPM value covers JS and TS
  identically), defined in source_symbols.py not core.py;
  (3) source_files's four new columns (language, content_hash,
  symbol_index_status, symbol_index_diagnostic) nullable identically on
  fresh and upgraded databases, verified via test_graph.py per the ADR's
  own text (test_graph.py itself is not part of this export);
  (4) occurrence-based symbol identity, UNIQUE(source_file_id, name,
  kind, line), line NOT NULL, adopted after live-verifying that a real
  @typing.overload-stacked Python function and a real overloaded
  TypeScript function declaration each produce three same-named rows at
  three distinct lines;
  (5) a five-value exposure model (public/restricted/internal/
  conventional_private/unknown), live-verified against eight
  representative Rust declarations;
  (6) a five-state SymbolIndexStatus model (indexed/indexed_partial/
  unsupported/parse_error/unreadable), modeled on
  git_topology.RepositoryTopology's status+reason+data shape (that
  module is not part of this export);
  (7) a project-level meta.source_index_version marker, value "1",
  written unconditionally by rebuild_deterministic whenever a
  Phase-77-aware rebuild runs, whose absence (not NULL) means "never
  indexed under Phase-77-aware code," mirroring meta.git_topology_status
  (also not part of this export);
  (8) query source/query source-symbol stay structurally separate from
  query symbol;
  (9) Haskell is file-recognized but symbol-extraction-unsupported.
  Consequences section states schema version "10"->"11".
