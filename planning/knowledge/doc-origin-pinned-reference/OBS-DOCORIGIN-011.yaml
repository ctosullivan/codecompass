raw_result: >
  _insert_doc_artifacts resolves `vendor_id = vendor_ids[d.vendor_name]
  if d.vendor_name is not None else None`, where vendor_ids is a dict
  keyed by vendor name built from vendors already inserted in the same
  sync run (via _fetch_ids-style helpers read earlier in the same
  function/module). This is a plain dict subscript with no .get()
  default and no try/except around it — passing a vendor_name for a
  vendor that isn't tracked (no vendor.toml entry, so never inserted
  into `vendors`) raises an uncaught KeyError at sync time, not a silent
  NULL or a soft failure.
