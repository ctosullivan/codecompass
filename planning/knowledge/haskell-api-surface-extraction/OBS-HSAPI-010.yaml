raw_result: |
  `:browse Hledger.Query` output includes, verbatim:
    type Query :: *
    data Query
      = Any
      | None
      | Date Hledger.Data.Types.DateSpan
      | Date2 Hledger.Data.Types.DateSpan
      | StatusQ Hledger.Data.Types.Status
      | Code Hledger.Utils.Regex.Regexp
      | Desc Hledger.Utils.Regex.Regexp
      | Tag Hledger.Utils.Regex.Regexp (Maybe Hledger.Utils.Regex.Regexp)
      | Acct Hledger.Utils.Regex.Regexp
      | Type [Hledger.Data.Types.AccountType]
      | Depth Int
      | DepthAcct Hledger.Utils.Regex.Regexp Int
      | Real Bool
      | Amt OrdPlus Hledger.Data.Types.Quantity
      | Sym Hledger.Utils.Regex.Regexp
      | Not Query
      | And [Query]
      | Or [Query]
      | AnyPosting [Query]
      | AllPostings [Query]
    ...
    type OrdPlus :: *
    data OrdPlus = Lt | LtEq | Gt | GtEq | Eq | AbsLt | AbsLtEq | AbsGt
      | AbsGtEq | AbsEq
    ...
    type QueryOpt :: *
    data QueryOpt
      = QueryOptInAcctOnly Hledger.Data.Types.AccountName
      | QueryOptInAcct Hledger.Data.Types.AccountName
      | QueryOptInterval Hledger.Data.Types.Interval
  i.e. all 18 `Query` constructors, all 10 `OrdPlus` constructors, and
  all 3 `QueryOpt` constructors are visible -- confirming `(..)` in a
  real, moderately complex export exposes every constructor of that
  type, not merely the type name itself.
