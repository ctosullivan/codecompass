what_was_done: >
  Grepped the whole pinned hledger checkout (`grep -rln '^#if\|^#ifdef\|
  ^#ifndef' --include='*.hs' .`, then, per match, printed the file's own
  module-header-to-`where` span) to find how common a CPP conditional
  actually appearing inside or near an export list is beyond the single
  Types.hs instance (OBS-HSAPI-011), and to find further real
  `module <Name>` self/cross re-export instances. Then read the
  relevant headers directly: hledger-lib/Hledger/Utils.hs (full,
  1-75), hledger/Hledger/Cli.hs:83-99, and
  hledger/Hledger/Cli/Script.hs:1-20 with its import block.
