what_it_shows: >
  A minimal, comment-aware mechanical scan (strip lines starting with
  `--`, then extract identifier tokens from the remaining export-list
  text) produces a name set that exactly matches GHC's own real,
  compiled `:browse` output for a real, non-trivial module
  (AccountName.hs, 48 names both ways, identical sets), including
  correctly excluding the one commented-out entry
  (`--  ,isAccountRegex`). This is a real, independent, executable
  confirmation -- not merely a re-reading of the same source text -- that
  the basic bare-name/`--`-comment-stripping approach is sufficient for
  at least this real file's export-list shape.
