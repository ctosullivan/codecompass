id: EV-HSAPI-001
kind: evidence
evidence_kind: source
what_it_shows: >
  CodeCompass's existing Rust/Cargo adapter precedent
  (extract_rust_symbols) is a single-pass, line-based scanner keyed on a
  per-declaration visibility keyword ("pub ...") physically adjacent, on
  consecutive lines, to both the declaration itself and its own
  preceding doc comment (`///`). Symbol name is the first identifier
  token after the matched prefix; purpose is the joined preceding
  comment lines, or None if absent.
