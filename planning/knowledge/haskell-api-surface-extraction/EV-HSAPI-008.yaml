what_it_shows: >
  `Type(..)` in a real, moderately complex export list (Query.hs's
  `Query(..)`, `OrdPlus(..)`, `QueryOpt(..)`) makes every one of that
  type's real data constructors visible -- confirmed directly against
  GHC's own compiled `:browse` output (18 Query constructors, 10
  OrdPlus constructors, 3 QueryOpt constructors, all listed), not merely
  inferred from reading the `data Query = ...` declaration's own source
  text.
