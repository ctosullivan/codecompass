id: EV-HSAPI-009
kind: evidence
evidence_kind: source
what_it_shows: >
  A real export list can contain a self-referential `module <OwnName>`
  re-export entry (Hledger/Data/Types.hs re-exports `module
  Hledger.Data.Types` from inside its own export list, functionally
  close to omitting the export list entirely but written explicitly)
  combined with a literal CPP preprocessor conditional
  (`#if MIN_VERSION_time(1,11,0)` / `#endif`) gating whether one further
  named export (`Year`) is included -- a purely textual/mechanical
  scanner with no preprocessor pass has no way to evaluate that
  condition from the file's own text alone.
observations: [OBS-HSAPI-011]
