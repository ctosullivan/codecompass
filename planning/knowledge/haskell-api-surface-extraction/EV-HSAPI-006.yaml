id: EV-HSAPI-006
kind: evidence
evidence_kind: source
what_it_shows: >
  The package-level `exposed-modules`/`other-modules` boundary
  (distinct from a module's own export list) is real in both
  hledger-lib.cabal and hledger.cabal, but in this pinned revision it
  excludes almost nothing real: for hledger-lib, only Setup.hs and two
  build-autogenerated modules (Paths_hledger_lib, PackageInfo_
  hledger_lib) are outside exposed-modules among everything found under
  the source tree; for hledger, only the autogenerated Paths_hledger is
  outside exposed-modules. Every hand-authored hledger-lib and hledger
  source module is exposed.
observations: [OBS-HSAPI-007, OBS-HSAPI-008]
