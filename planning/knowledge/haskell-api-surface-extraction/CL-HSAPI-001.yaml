id: CL-HSAPI-001
kind: claim
statement: >
  For a Haskell module's export list, the baseline mechanical shapes --
  a bare comma-separated identifier list (leading- or trailing-comma
  style, both real), `Type(..)` (exports the type plus every one of its
  real data constructors), whole-line `--`-prefixed comments including
  commented-out disabled entries, and Haddock `-- * Section` grouping
  headers that carry no identifier -- are correctly and completely
  handled by a simple comment-stripping-then-tokenising scan, with no
  need for a full parser. This was independently confirmed against a
  real compiler, not merely re-derived from reading the same source
  text: a naive comment-aware scan over AccountName.hs produced exactly
  the same 48-name set as GHC's own `:browse` output, and Query.hs's
  `Query(..)`/`OrdPlus(..)`/`QueryOpt(..)` were confirmed via `:browse`
  to expand to all 18/10/3 real constructors respectively.
