what_was_done: >
  Ran `grep -rn "\.ecosystem\b" src/codecompass/adapters/*.py
  src/codecompass/sync.py` and manually inspected every hit, to check
  whether ExternalAdapterProcess's own wire-reported `ecosystem`
  attribute (set in initialize(), OBS-ADPT-005) is ever read/validated
  anywhere else in the codebase.
