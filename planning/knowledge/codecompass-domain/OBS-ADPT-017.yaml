raw_result: >
  Every remaining hit after excluding the assignment site itself and
  `config.ecosystem`/`self.config.ecosystem` (VendorConfig's own field,
  a different attribute entirely) is empty -- no code anywhere in
  src/codecompass/ reads ExternalAdapterProcess.ecosystem (the wire
  response's free-text "ecosystem" field, distinct from
  core.Ecosystem/VendorConfig.ecosystem) after it is set in
  initialize(). HaskellAdapter never references self-process.ecosystem;
  get_adapter's dispatch is driven entirely by VendorConfig.ecosystem
  (a closed 4-member Ecosystem enum, fixed on the CodeCompass side
  before any adapter process is even invoked). The wire-level
  "ecosystem" field is therefore currently write-only telemetry from
  CodeCompass's own perspective -- stored on the ExternalAdapterProcess
  instance but never consulted for dispatch, validation, or any other
  decision.
