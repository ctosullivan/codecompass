what_it_shows: >
  EcosystemAdapter (src/codecompass/adapters/base.py) is an ABC
  constructed with (config: VendorConfig, project_root: Path), defining
  five abstract methods (installed_version, source_location,
  readme_and_api_surface, repository_url, dependency_tree) and one
  concrete method (symbols(), Phase 62, with a default walk+extract
  implementation any subclass may override). get_adapter()
  (src/codecompass/adapters/__init__.py) is the single dispatch point:
  a closed, total dict mapping each of Ecosystem's four members to
  exactly one adapter class (NpmAdapter, PythonAdapter, CargoAdapter,
  HaskellAdapter).
