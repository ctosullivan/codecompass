id: EV-SKEP-001
kind: evidence
evidence_kind: source
what_it_shows: >
  CL-ADPT-008's disclosed "adapter" (decisions/0058's own prose) vs.
  "adaptor" (.gitmodules, the real checked-out directories, every
  in-repository code docstring) naming contradiction resolves to a
  simple, pre-implementation drafting mismatch, not a live, ongoing
  ambiguity about which spelling the project intends. decisions/0058's
  own commit (886dc6ef..., 2026-09-19 09:29:33 +0800) predates, by five
  hours on the same calendar day, the commit that actually created and
  checked out the two real external repositories (41bae257...,
  2026-09-19 14:29:49 +0800, OBS-SKEP-001) -- so the ADR's "adapter"
  spelling was written before either repository existed, and the
  "adaptor" spelling is what was actually used when they were really
  created. `git ls-remote` independently confirms both "adaptor"-spelled
  repositories are real, live, public GitHub repositories with genuine
  commit history and a real v0.1.0 tag each, while the "adapter"-spelled
  protocol URL decisions/0058's own prose would imply behaves exactly
  like a repository that was never created (OBS-SKEP-002). Every
  downstream artifact -- the .gitmodules remote URLs, the real checked-
  out submodule path, and every module-level docstring in
  base.py/external_process.py/haskell.py -- consistently uses "adaptor"
  and has done so, unchanged, since the single commit that introduced
  them; nothing in this repository's history shows the spelling was ever
  the reverse and later renamed. Taken together, this is best read as an
  uncorrected spelling typo in decisions/0058's own Decision-section
  prose, written aspirationally before the real repositories it
  describes were created, never revisited afterward (ADRs are
  append-only, per CLAUDE.md §2, so decisions/0058's own text cannot
  self-correct) -- not a genuine, currently-open question about which
  spelling the project actually intends. The real, live, functioning
  repositories this project actually depends on (pinned by real gitlink
  commits in .gitmodules) are unambiguously "adaptor"-spelled.
  This does not itself decide whether a corrective/errata ADR entry
  should be filed for decisions/0058 -- that editorial choice belongs to
  whoever owns decisions/*.md (CLAUDE.md §8: not this role), not to this
  finding.
observations: [OBS-SKEP-001, OBS-SKEP-002]
