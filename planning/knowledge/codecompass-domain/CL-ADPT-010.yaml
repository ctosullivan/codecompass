id: CL-ADPT-010
kind: claim
statement: >
  decisions/0058's own "adapter"-spelled repository names
  ("codecompass-adapter-protocol", "codecompass-adapter-haskell") are a
  pre-implementation drafting typo, not a live, unresolved naming
  question. The ADR's own commit (886dc6ef..., 2026-09-19 09:29:33
  +0800) predates, by five hours the same day, the commit that actually
  created and checked out the two real external repositories
  (41bae257..., 2026-09-19 14:29:49 +0800) -- so the "adapter" spelling
  was written aspirationally before either repository existed.
  "codecompass-adaptor-protocol" and "codecompass-adaptor-haskell" (the
  "adaptor" spelling) are the real, live, public GitHub repositories
  this project actually depends on -- confirmed independently reachable
  with real commit history and a real v0.1.0 tag each -- and every
  downstream artifact (.gitmodules, the checked-out submodule paths,
  every module docstring in base.py/external_process.py/haskell.py) has
  used "adaptor" consistently, unchanged, since the single commit that
  introduced them. This claim resolves and supersedes CL-ADPT-008's own
  "I could not determine which spelling is canonical" conclusion with
  new evidence CL-ADPT-008 did not have. This claim does not decide
  whether decisions/0058's own text should receive a corrective ADR
  entry -- that editorial choice belongs to whoever owns decisions/*.md,
  not to this record.
derivation: DE-ADPT-010
