  graph.py's git-topology schema and rebuild_deterministic directly
  (OBS-CTXT-017) and confirmed, rather than assumed, that the two FK
  columns do satisfy that literal lifecycle test -- so option (a) could
  not be dismissed on lifecycle grounds alone. Per this role's own
  "trace every real path, don't stop at the first plausible one"
  discipline, did not stop there: ran a targeted follow-up grep
  (OBS-CTXT-018) checking whether the git-topology tables are actually
  wired into the same traversable graph as the six edge tables via any
  FK to/from vendors/symbols/source_files/doc_artifacts -- found they
  are not, which is the first real evidence for option (b) rather than
