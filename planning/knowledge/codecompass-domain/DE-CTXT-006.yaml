  introduced these tables, specifically to check whether the project's
  own governing design document ever states an intent either way --
  found it explicitly frames these as "mechanical facts only, no
  semantic relationship edges" and deliberately rejects modelling them
  via the existing content entities, which is real evidence of a
  considered design choice, not merely an implementation accident.
  Finally checked the CLI/query-surface level (OBS-CTXT-020) as a
