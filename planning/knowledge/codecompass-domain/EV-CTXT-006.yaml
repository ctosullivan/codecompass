what_it_shows: >
  The project's own highest-level, agent-facing definition (ai-docs/
  README.md) describes CodeCompass's output as "per-vendor digests
  plus a SQLite context graph" -- treating "digest" and "context graph"
  as two named, coordinate outputs joined by "plus," not one undivided
  concept called "context." "Context" in this canonical sentence names
  the graph specifically, not an umbrella for every artifact
  CodeCompass produces.
