id: EV-EVID-013
kind: evidence
evidence_kind: documentation
what_it_shows: >
  "Provenance" is never a record kind of its own anywhere in this
  codebase; it is a cross-cutting property realized with a different
  concrete shape per mechanism: Phase 54c's own records carry a named
  set of provenance fields (repository_revision, source_ref/doc_ref/
  test_ref, performed_by/derived_by/decided_by, tool/tool_version,
  timestamp); enrichment tables carry one `model` TEXT column;
  context-gaps/context-observations entries carry four narrative
  fields (origin, date, codecompass_revision, project). No shared
  schema unifies these three.
