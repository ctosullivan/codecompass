id: EV-ADPT-012
kind: evidence
evidence_kind: source
what_it_shows: >
  The gap described by OBS-ADPT-017/EV-ADPT-010 (ecosystem.md's own
  "Counterexample" section) — that `ExternalAdapterProcess.ecosystem`
  "is stored but never subsequently read, compared against
  `core.Ecosystem`, or used for any dispatch or validation decision" —
  is closed. `initialize()` now takes a required keyword-only
  `expected_ecosystem: str` parameter and, immediately after setting
  `self.ecosystem` from the wire response, raises `AdapterError`
  ("external adapter ecosystem mismatch: CodeCompass configured this
  adapter under {expected_ecosystem!r}, adapter responded with
  {self.ecosystem!r}") if the two disagree. `HaskellAdapter._analyze`
  — the one production call site (OBS-ADPT-019) — passes
  `expected_ecosystem=self.config.ecosystem`, i.e. the real
  `core.Ecosystem` value CodeCompass configured this adapter under via
  `vendor.toml`, closing the loop the Counterexample described as
  open. This is a real behavior change: the wire-level `ecosystem`
  field is no longer write-only telemetry — it is now read and
  compared on every `initialize` call, before `analyze_project` is
  reached. Exercised end to end by a real, currently-passing test
  (`test_ecosystem_mismatch_raises_adapter_error`, OBS-ADPT-020).
  Narrower point preserved unchanged by this fix: adapter *dispatch*
  (`get_adapter`) is still driven entirely by `VendorConfig.ecosystem`,
  never by the wire-reported value — this fix adds a validation check,
  not a new dispatch path — so ecosystem.md's own "is-the-category-
  that"/"determines" Relationships entries remain accurate as stated.
observations: [OBS-ADPT-017, OBS-ADPT-018, OBS-ADPT-019, OBS-ADPT-020]
