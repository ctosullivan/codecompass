what_it_shows: >
  Phase 54c defines six flat, closed-field record kinds (Observation,
  Evidence, Claim, Derivation, Decision, Requirement) and, separately,
  a "context packet" as one specific Implement-stage artifact
  (context-packet.md): a deliberately smaller-than-design.md, curated
  Markdown compaction, feature-scoped under
  planning/knowledge/<feature-slug>/, produced by a knowledge-curator
  mode from records reachable only from an APPROVED design.md, with a
  fixed section list and an explicit exclusion list (no full research
  narrative, no raw Observation/Evidence detail).
