  "context" as *whatever CodeCompass surfaced for that task* (digests,
  graph query output, packets, etc. -- not scoped to one artifact
  type), distinct from context-health.md's forward-looking, whole-graph
  assessment (OBS-CTXT-006) and distinct from a context-packet.md
  (OBS-CTXT-003), which is Phase 54c's own specific Implement-stage
