  "Context-quality evaluation" is the context-evaluator agent's report
  template judging whether CodeCompass's context gave a real advantage
  on one reference-project task, by having the evaluator inspect the
  target repository directly (never using CodeCompass to validate
  CodeCompass) and comparing against a stated LOW/MODERATE/HIGH
