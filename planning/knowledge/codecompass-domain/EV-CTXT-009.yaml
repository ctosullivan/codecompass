id: EV-CTXT-009
kind: evidence
evidence_kind: source
what_it_shows: >
  VendorDigest (src/codecompass/core.py:66-103) is a real, named,
  mutable dataclass -- "Aggregate output of generating a single
  vendor's documentation" -- combining deterministic fields
  (file_tree/dep_tree/api_surface, no AI) with a read-only lookup of
  this vendor's current vendor_enrichment row (technical_description/
  conversational_overview/action_pointer_file/action_pointer_note).
  sync.py's sync_vendor (lines 160-202) constructs exactly one
  VendorDigest per vendor per whole-project sync and writes it out as
  DEPTREE.md/deptree.json, FILETREE.md/filetree.json, OVERVIEW.md
  (conditionally), and CLAUDE.md (via render_vendor_claude_md) under
  vendor/<name>/ -- unconditionally, on every sync, for every tracked
  vendor.
