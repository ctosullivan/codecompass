raw_result: >
  The ADR's own Decision text states: "An agent's suggested
  relationship is an observation with provenance. It is captured in
  `planning/context-gaps/` and nowhere else... It never enters
  `context-graph.db`... It becomes authoritative only by promotion
  through the learning lifecycle" into either a Stage C
  mechanical-detection improvement (GATE DB) or a Stage E graph
  capability (GATE DD). Also states `planning/context-gaps/` is "a
  sibling of `planning/learnings/`, not part of it... a learning is
  'how we should work'; a context-gap is 'what the graph cannot
  represent'." This ADR's own use of the word "observation" (lower-case,
  ordinary English -- "an observation with provenance") predates Phase
  54c's own formal `kind: observation` record (Phase 43c vs. Phase 54c)
  and is not the same schema, though it is a direct conceptual
  ancestor cited by phase-54c-evidence-knowledge-workflow.md's own §0
  and §1 table.
