raw_result: >
  Decision text, verbatim intent: "An agent's suggested relationship is
  an observation with provenance. It is captured in
  planning/context-gaps/ and nowhere else." It never enters
  context-graph.db -- no agent_suggested_edges table, no
  source='agent_inference' column, no write path from a context-gaps/
  entry into any graph table -- and becomes an actual graph edge (or a
  Stage E graph capability) only by promotion through the learning
  lifecycle, each with its own separately-gated ADR. This is the
  project's own explicit statement that "a relationship someone
  plausibly noticed" and "a relationship/edge is a mechanically-proven
  context-graph.db row" are not the same concept, and conflating them
  was named as a real risk ("indistinguishable, three phases later,
  from a mechanically-proven one").
