raw_result: >
  EcosystemAdapter.__init__ takes (config: VendorConfig, project_root:
  Path) and stores both verbatim. Five methods are abstract
  (installed_version, source_location, readme_and_api_surface,
  repository_url, dependency_tree); symbols() is concrete, not abstract,
  with a default implementation (lines 94-97) that walks
  self.source_location() via iter_source_files and dispatches each file
  through extract_symbols_for_file(path, self.config.ecosystem) -- the
  same walk+extract pairing sync.py::rebuild_project_graph used to
  perform itself before Phase 62. The docstring (lines 72-93) states
  this default is deliberately concrete so "a future adapter that
  doesn't implement structured extraction isn't forced to (no TypeError
  at construction)" and names HaskellAdapter as the one adapter that
  overrides symbols() because extract_symbols_for_file "has no Haskell
  branch, and never will."
