raw_result: >
  `codecompass-adaptor-protocol.git` (adaptor spelling): resolves, real
  refs returned -- HEAD and refs/heads/main both at
  596fb94fae9972739f016968dee320160a803175, plus a real
  refs/tags/v0.1.0 (2aad62d8d1408fbccfab9f4293ba53f03fcaf958,
  dereferencing to 89126860fa7daa3245eb92b0cb4bebac077b43a2). Exit 0.
  `codecompass-adaptor-haskell.git` (adaptor spelling): resolves
  identically -- HEAD/refs/heads/main at
  dfd7a783667a91ba5a55a9f2b534cc0c1eb746ae, refs/tags/v0.1.0 at
  130618cb9278a20350a856d4495fda00cc41076b. Exit 0.
  `codecompass-adapter-protocol.git` (adapter spelling, matching
  decisions/0058's own prose): `fatal: could not read Username for
  'https://github.com': No such device or address`. Exit 128.
  Control (`this-repo-should-not-exist-xyz123.git`, known-fabricated,
  near-certainly-never-registered): identical error text and exit code
  128 as the "adapter"-spelled URL. Anonymous, non-interactive git
  cannot distinguish "repository does not exist" from "repository is
  private" -- both produce this same generic credential-prompt failure
  -- so this test cannot prove the "adapter"-spelled repository does not
  exist, but it does prove the "adaptor"-spelled repositories are real,
  live, public, and tagged v0.1.0, while the "adapter"-spelled protocol
  URL behaves identically to a repository that was never created, not
  like a real, reachable public repository.
