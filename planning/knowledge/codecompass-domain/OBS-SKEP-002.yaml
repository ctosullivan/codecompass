what_was_done: >
  Ran `git ls-remote` against four URLs to test which spelling of the
  two new repository names ("adapter" per decisions/0058's own prose,
  "adaptor" per .gitmodules/every checked-out artifact) corresponds to
  a real, live, public GitHub repository:
  https://github.com/ctosullivan/codecompass-adaptor-protocol.git,
  https://github.com/ctosullivan/codecompass-adapter-protocol.git,
  https://github.com/ctosullivan/codecompass-adaptor-haskell.git, and,
  as a control, a deliberately fabricated, near-certainly-nonexistent
  URL (https://github.com/ctosullivan/this-repo-should-not-exist-xyz123.git)
  to characterize what anonymous git's own error output looks like for a
  repository that does not exist, so a null result on the "adapter"
  spelling could be interpreted correctly.
