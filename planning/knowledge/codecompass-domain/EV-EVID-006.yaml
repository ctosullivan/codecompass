what_it_shows: >
  Phase 57's own candidate design (v1-redefinition/roadmap.md's Stage
  E section) already proposes Evidence/Observation/Claim/Decision
  (and, in one bullet, Verification) as possible graph-level
  (context-graph.db) entity kinds for representing provenance about
  other projects' dependencies -- the same four names Phase 54c's
  file-based model already uses for CodeCompass's own development-
  process records, for a different purpose, with resolution explicitly
  deferred to Stage E's own future Domain stage.
