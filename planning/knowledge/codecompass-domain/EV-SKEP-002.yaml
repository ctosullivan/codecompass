what_it_shows: >
  Four `docs/domain/concepts/*.md` citations into
  `planning/v1-redefinition/roadmap.md` are stale by exactly one line
  each, as a direct mechanical consequence of Phase 66's own `L-021`
  status-fix commit (2e184c4) inserting one net line before the cited
  content -- not because the cited paragraphs themselves were edited,
  moved out of context, or changed in meaning. `evidence.md:135`,
  `decision.md:117`, and `claim.md:126` each cite
  `planning/v1-redefinition/roadmap.md:1060-1086` for "the graph-level
  naming-collision note"; the correct current citation is
  `:1061-1087` (OBS-SKEP-003). `provenance.md:99` and `:117` each cite
  `planning/v1-redefinition/roadmap.md:1080-1086` for Phase 57's
  candidate graph-level provenance generalisation; the correct current
  citation is `:1081-1087` (OBS-SKEP-003 -- the closing line of the
  Phase 57 CONDITIONAL bullet, "demonstrably required.", is now at
  1087, not 1086). In every case the cited prose itself is confirmed
  unchanged text at a shifted line number, not a changed or
  contradicted claim -- this is a pure citation-location correction,
  not a domain-meaning or content-staleness finding. Correcting these
  four citations is out of this role's own write boundary (`docs/
  domain/` is never edited by `domain-skeptic`, even for a
  one-line-obviously-correct fix, per `decisions/0060`) and is named
  here for whoever holds write access to the approved corpus to apply.
observations: [OBS-SKEP-003]
