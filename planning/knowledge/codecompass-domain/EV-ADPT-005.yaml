what_it_shows: >
  Ecosystem (src/codecompass/core.py) is a closed 4-member StrEnum
  (npm, python, cargo, haskell). VendorConfig is a frozen dataclass with
  exactly (name: str, ecosystem: Ecosystem) -- one tracked dependency,
  belonging to exactly one Ecosystem. decisions/0002 establishes that
  each ecosystem's adapter uses "whatever native tooling its ecosystem
  already provides," explicitly rejecting a single unified
  cross-ecosystem parsing strategy -- i.e. the adapter is where
  per-ecosystem judgment calls live, not the vendor record or the
  ecosystem enum itself.
