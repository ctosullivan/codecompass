id: CL-ADPT-002
kind: claim
statement: >
  Two EcosystemAdapter implementation strategies coexist by deliberate
  design, not as one superseding the other: (1) in-process (npm,
  Python, Cargo) -- an importable Python class inside src/codecompass/
  shelling out to native ecosystem tooling; (2) external-process
  (Haskell, the reference implementation) -- a thin in-process
  dispatcher for simple manifest reads, delegating all real
  ecosystem-specific logic to an independent OS process speaking a
  small JSON-Lines protocol, motivated by ecosystems (e.g. a
  hypothetical proprietary COBOL adapter) whose implementation cannot or
  should not be in-process, GPL-covered Python code. decisions/0002 (the
  first strategy) is explicitly "not superseded" by decisions/0057 (the
  second) -- in-process remains the default, lower-overhead strategy.
