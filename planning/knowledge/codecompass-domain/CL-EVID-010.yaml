id: CL-EVID-010
kind: claim
statement: >
  This codebase has at least FIVE genuinely distinct "something was
  noticed/recorded" mechanisms, each at a different trust/purpose
  level, distinguishable by real evidence rather than by name alone:
  (1) Phase 54c's `kind: observation` (OBS-<feature>-NNN) -- a
  primary-research act of looking, feeding an Evidence/Claim, written
  under planning/knowledge/<slug>/, never itself authoritative; (2)
  `planning/context-gaps/` -- "a relationship CodeCompass's context
  should represent but mechanical detection doesn't/can't," prose
  captured only in planning/, explicitly never entering
  context-graph.db (decisions/0051), promoted only via the learning
  lifecycle to a Stage C/E gated roadmap decision; (3)
  `planning/context-observations/` -- "how real context experience
  went" with an edge that ALREADY EXISTS (EDGE_USEFUL/UNHELPFUL/
  MISLEADING/STALE/REDUNDANT), the explicit inverse scope of (2)
  (experience with edges that exist vs. requests for edges that don't),
  confusingly reusing the literal "OBS-" id-prefix from (1) for an
  unrelated shape; (4) `planning/learnings/` -- "how we should work," a
  project-process lesson queue reviewed by the same `knowledge-curator`
  as (2)/(3) but routing to a different destination set (tests/ADRs/
  docs/CLAUDE.md/skills/roadmap rows, never a detection heuristic or
  graph capability); (5) AI-authored graph enrichment
  (vendor_enrichment/symbol_enrichment/doc_relation_enrichment) --
  interpretive content an AI produces ABOUT AN ALREADY-PROVEN graph
  fact, written through `apply_results()`, tagged only by a `model`
  column, explicitly "never a fact CodeCompass proves" (decisions/0054)
  -- the only one of the five that writes anywhere inside
  context-graph.db itself, and the only one with no Observation/
  Evidence/Claim-style narrative chain behind it at all. None of the
  five is interchangeable with, or a special case of, another; each has
  its own destination, its own write boundary, and (for 1-4) its own
  queue file(s).
