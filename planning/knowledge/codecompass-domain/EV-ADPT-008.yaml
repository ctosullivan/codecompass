what_it_shows: >
  decisions/0058's own Decision-section prose consistently names the new
  repositories "codecompass-adapter-protocol" and
  "codecompass-adapter-haskell" (adapter spelling), but the actually
  implemented/checked-out artifacts -- .gitmodules' own submodule names
  and remote URLs, the real checked-out directory
  (protocol/codecompass-adaptor-protocol/), and every module-level
  docstring in base.py/external_process.py/haskell.py that names these
  repositories in prose -- consistently use "adaptor" spelling
  ("codecompass-adaptor-protocol", "codecompass-adaptor-haskell").
  This is a literal, verifiable spelling mismatch between the governing
  ADR's own stated repository names and the real, implemented
  repository names, present at this revision.
