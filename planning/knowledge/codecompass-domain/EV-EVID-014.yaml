what_it_shows: >
  vendor_enrichment, symbol_enrichment, and doc_relation_enrichment are
  flat, single-row-per-fact tables (no status column, no supersedes
  column, no observations/supporting_evidence/contradicting_evidence
  list) each holding one free-text interpretive value plus, on two of
  the three tables, one provenance string column (`model`) -- a
  structurally much thinner provenance mechanism than any of Phase
  54c's six record kinds, and symbol_enrichment carries no provenance
  column at all.
