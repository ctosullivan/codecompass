raw_result: >
  `symbol_enrichment` now has five columns, not four: `id, symbol_id,
  purpose TEXT NOT NULL, model TEXT, generated_at TEXT NOT NULL`
  (line 180 is the new `model` column). It is **nullable**, not `NOT
  NULL` — this is a real, deliberate difference from `vendor_
  enrichment.model`/`doc_relation_enrichment.model`, both `TEXT NOT
  NULL` since their own first schema version (per this migration
  function's own docstring, lines 522-535): a pre-existing `symbol_
  enrichment` row's real producer was never recorded, so the migration
  backfills `NULL` rather than inventing a value, honouring this
  project's stated "honest gaps over fabricated certainty" principle.
  `_migrate_symbol_enrichment_model_column` (an `ALTER TABLE ... ADD
  COLUMN`, not a drop-and-recreate) runs on every `open_graph` call and
  is idempotent (checked via `PRAGMA table_info`, only altering if
  `model` is absent). `record_symbol_enrichment` (the only writer to
  this table) now requires a real `model: str` argument — no default —
  for every call; its one production call site
  (`enrichment.py:427`, confirmed by OBS-EVID-018) passes `model=
  _MODEL` (the real Anthropic model id used for that batch). So: the
  column now exists and every *new* write populates it with a real
  producer value, but any row written before this migration remains
  `NULL` — a narrower, residual distinction from the two `NOT NULL`
  sibling columns that this observation does not consider closed.
