what_was_done: >
  Ran `grep -ni "connector"` against each of the seven files
  `docs/domain/concepts/connector.md`'s own Definition section cites as
  listing "connector" purely as a candidate term to research
  (`decisions/0060-scope-plan-domain-design-implement-methodology.md`,
  `planning/phase-63d-domain-reconstruction.md`,
  `planning/v1-redefinition/development-methodology.md`,
  `planning/v1-redefinition/roadmap.md`, `planning/CONTEXT.md`,
  `planning/ROADMAP.md`, `CHANGELOG.md`), to test Phase 66's own drift
  audit's claim (`planning/retros/_drift-audit-phase-66.md`) that
  `planning/CONTEXT.md`'s rewrite from ~2449 to ~126 lines (current-
  only, per `CLAUDE.md` §4) dropped the word "connector" entirely,
  making `connector.md`'s enumerated citation list stale for one of
  its seven named files.
