id: EV-CTXT-012
kind: evidence
evidence_kind: documentation
what_it_shows: >
  decisions/0051 states, as an accepted project decision, that an
  agent's suggested relationship is captured in planning/context-gaps/
  and "nowhere else" -- it never enters context-graph.db (no staging
  table, no source='agent_inference' column, no write path into any
  graph table) and becomes an actual graph edge only through a
  separately-gated promotion (a Stage C mechanical-detection ADR or a
  Stage E graph-capability ADR). The decision names the risk explicitly:
  an ungated agent-suggested edge would be "indistinguishable, three
  phases later, from a mechanically-proven one."
