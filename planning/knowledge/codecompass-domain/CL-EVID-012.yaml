id: CL-EVID-012
kind: claim
statement: >
  A "Claim" record (CL-<feature>-NNN), in Phase 54c's own model, is an
  agent's interpretation built from one or more Evidence records --
  the ONLY place a support/contradict relationship is recorded (never
  on Evidence itself, CL-EVID-001). Its `status` enum
  (proposed|supported|contradicted|superseded|verified) is the only
  place "how sure are we" is recorded, with no numeric confidence
  score anywhere. Its `supersedes` field only ever names a prior Claim,
  never a Decision (structural hard rule, mechanically enforced by
  scripts/check_knowledge_base.py); a Claim about observed behaviour is
  revised only by a new Claim backed by new/reinterpreted Evidence or
  Derivation, never by a Decision. As a genuinely fuzzy, currently-
  unresolved boundary: every real Claim produced under this model
  before Phase 72 had `contradicting_evidence: []`, and until this
  Claim (and its sibling CL-EVID-011) every real Claim also had
  `supersedes: null` -- CL-EVID-011/CL-EVID-012 are this model's first
  real exercise of the Claim-supersedes-Claim mechanism with real
  content (a narrow, mechanical resolution-mechanism correction, not a
  substantive reversal), so this claim's own account of how that
  mechanism behaves under a genuine contradiction (as opposed to a
  citation-freshness correction) remains honestly untested, not merely
  theoretical.

  This formal "Claim" is also a distinct concept from the same word
  used as a candidate GRAPH-LEVEL entity kind in a candidate design
  originally sketched in `planning/v1-redefinition/roadmap.md`'s old
  "Stage E" section, `conditional-generalisation.md` §2.4 (CL-EVID-011,
  superseding CL-EVID-009, documents that collision directly) -- both
  represent "an interpretation with provenance" in the abstract, but at
  different scopes (file-based development-process record vs. a
  proposed context-graph.db table about a target project's own
  dependencies) and neither is built from or reducible to the other.

  This Claim supersedes CL-EVID-003 for the same narrow reason
  CL-EVID-011 supersedes CL-EVID-009: CL-EVID-003's own statement named
  the colliding graph-level design as "Phase 57's own Stage E design
  sketch," and `decisions/0062` (Phase 72) retires the "Stage E"
  phase-group label project-wide -- the candidate design itself
  (`conditional-generalisation.md` §2.4) is unaffected and is now
  re-homed to Priority B by `planning/pre-v1-disposition.md` §7, per
  `decisions/0062`. Everything else in CL-EVID-003's original statement
  -- the Claim-schema account, the untested-mechanism disclosure, the
  fact of the naming collision itself -- is unchanged and re-asserted
  here.
