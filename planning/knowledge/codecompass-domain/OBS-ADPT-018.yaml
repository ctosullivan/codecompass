raw_result: >
  Both gaps are closed as of this working tree. `initialize` (line 53)
  now takes a required keyword-only `expected_ecosystem: str` parameter
  — no default. After setting `self.ecosystem`/`self.capabilities` from
  the wire response exactly as before, it now (lines 93-104) raises
  `AdapterError` ("external adapter ecosystem mismatch: CodeCompass
  configured this adapter under {expected_ecosystem!r}, adapter
  responded with {self.ecosystem!r}") if `self.ecosystem !=
  expected_ecosystem`, and separately computes `unrecognized = [c for c
  in self.capabilities if c not in CAPABILITIES]`, raising
  `AdapterError` ("external adapter reported unrecognized capabilities
  {unrecognized!r} — expected a subset of {CAPABILITIES!r}") if
  non-empty. `haskell.py`'s `_analyze()` (line 188) now calls
  `process.initialize(expected_ecosystem=self.config.ecosystem)` —
  `self.config.ecosystem` is `core.Ecosystem`, the same closed
  4-member enum `ecosystem.md`'s own Definition describes, passed as a
  real value at this call site, not a placeholder or a hardcoded
  string. Both new checks run unconditionally on every `initialize`
  call, before `analyze_project` is ever invoked.
