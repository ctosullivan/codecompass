raw_result: >
  balance_from_spec(journal, spec, query=None) iterates spec.sections,
  applies an optional outer Query filter via the canonical query engine,
  includes postings whose account matches any of section.accounts,
  excludes postings matching section.exclude, applies depth truncation,
  aggregates per-account amounts, and inverts the sign when
  section.invert is True -- returning one ReportSectionResult per
  section. TestBalanceFromSpec::test_single_section_rows_and_subtotal
  asserts a single Expenses section's own subtotal (1359.00) against the
  pinned tests/fixtures/filtered.journal fixture;
  test_multi_section_correct_values asserts both an inverted Income
  section (6000.00) and an Expenses section (1359.00) in the same
  report. Both tests pass against the current, unmodified checkout.
